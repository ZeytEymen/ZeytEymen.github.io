<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sayfa bulunamadı — viliyimsi</title>
<meta name="description" content="Aradığınız sayfa bulunamadı.">
<meta name="robots" content="noindex, follow">

<!-- DİKKAT: 404 her derinlikteki adreste açılabildiği için yollar mutlak olmalı.
     Bu yüzden bu sayfa dosyaya çift tıklayarak (file://) doğru görünmez;
     sunucuda veya yerel bir sunucu üzerinden doğru çalışır. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">

<style>
  .notfound {
    min-height: 46vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: var(--measure);
  }
  .notfound-code {
    font-size: 0.6875rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 1.25rem;
  }
  .notfound-links {
    display: flex;
    flex-wrap: wrap;
    gap: 1.75rem;
    margin-top: 2.25rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
  }
  .notfound-links a {
    color: var(--soft);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.15rem;
    transition: border-color 0.25s ease, color 0.25s ease;
  }
  .notfound-links a:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>

<div class="page">

  <header class="masthead">
    <a href="/" class="wordmark">
      <img src="/img/logo.png" width="603" height="169" alt="viliyimsi">
    </a>
    <div class="mast-right">
      <nav class="nav" aria-label="Ana menü">
        <a href="/kitaplar/">Kitaplar</a>
        <a href="/projeler/">Projeler</a>
        <a href="/hakkinda/">Hakkında</a>
        <a href="/iletisim/">İletişim</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="notfound">
      <p class="notfound-code">Hata 404</p>
      <h1 class="page-title">Bu sayfa yok.</h1>
      <p class="intro" style="margin-bottom: 0">
        Adres yanlış yazılmış olabilir ya da sayfa taşınmış olabilir.
        Aşağıdakilerden devam edebilirsiniz.
      </p>

      <div class="notfound-links">
        <a href="/">Ana sayfa</a>
        <a href="/kitaplar/">Kitaplar</a>
        <a href="/projeler/">Projeler</a>
        <a href="/iletisim/">İletişim</a>
      </div>
    </div>
  </main>

  <footer class="foot">
    <span>© 2026 viliyimsi — Tüm hakları saklıdır</span>
    <span class="foot-social">
      <a href="https://instagram.com/" rel="noopener">Instagram</a>
      <a href="https://x.com/" rel="noopener">X</a>
    </span>
  </footer>

</div>

</body>
</html>
